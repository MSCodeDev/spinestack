services:
  spinestack:
    image: ghcr.io/mscodedev/spinestack:latest
    # Only used by `docker compose build`; `pull` and `up -d` use the published image.
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Public URL you open the app at
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      # Generate with: openssl rand -hex 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      HARDCOVER_API_TOKEN: ${HARDCOVER_API_TOKEN:-}
    volumes:
      - spinestack-data:/data

volumes:
  spinestack-data:
